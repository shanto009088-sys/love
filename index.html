<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Step 1: Fullscreen emoji -->
<div id="fullscreenEmoji">😭</div>

<!-- Step 2: Center emoji + Click Me -->
<div id="centerEmoji" class="hidden">
  <span>😭💍💞</span>
  <div id="clickMeText">Click Me</div>
</div>

<!-- Step 3: Sorry texts -->
<div id="sorryContainer" class="hidden">
  <div class="sorryText left"></div>
  <div class="sorryText right"></div>
</div>

<!-- Step 4: Middle emoji + Click -->
<div id="middleEmoji" class="hidden">
  <span>😭💞💍</span>
  <div id="feelHeartText">Feel My Heart</div>
</div>

<!-- Step 5: I LOVE YOU 1000 -->
<div id="loveContainer" class="hidden"></div>

<!-- Step 6: Bottom emoji + Click Again -->
<div id="bottomArea" class="hidden">
  <div id="bottomEmoji">⬇️📩</div>
  <div id="clickAgain">Click Again</div>
</div>

<!-- Love-shave line -->
<div id="loveShave" class="hidden"></div>

<!-- Centered final text -->
<div id="finalText" class="hidden">I LOVE YOU WIFUUUU 💗🕊️💍😭💍💞</div>

<!-- Audio -->
<audio id="bgMusic">
  <source src="iwannabeyours.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
